server {
    listen 80;

    # React Router handles routes like /explain and /compare client-side.
    # Without this fallback, refreshing on /explain would hit nginx
    # looking for a real file at that path and 404 - there isn't one,
    # only index.html plus JS that reads the URL after load.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Mirrors vite.config.ts's dev-time proxy: /api/predict becomes a
    # request to the backend container's /predict. "backend" here is
    # the service name from docker-compose.yml - Docker's internal DNS
    # resolves it to the backend container automatically, no hardcoded
    # IP or localhost involved.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}